# SCOPE-ENV-3 — configuration Netlify du site autonome scope-sdisnv.
# Ne pas utiliser pour sdisnv-monitoring-f7 : le netlify.toml historique reste inchangé (index v67).
# Redirects data v67 (/records, etc.) volontairement absents.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfkit"]
  included_files = [
    "assets/js/scope-csv-import.js",
    "assets/js/scope-import-contract.js",
    "assets/js/scope-personnel-sync-contract.js",
    "assets/js/scope-personnel-referentials.js",
    "assets/js/scope-personnel-temporal.js",
    "assets/js/scope-personnel-display.js",
    "assets/img/logo-scope-blanc.png",
    "assets/img/LogoSDISblanc.png",
    "assets/img/LogoSDISseulnoir.png",
    "assets/img/MCE_Signature.png",
    "netlify/functions/data/**",
    "node_modules/pdfkit/js/data/**"
  ]

[[redirects]]
  from = "/"
  to = "/scope.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/scope.html"
  status = 200
  force = true

[[redirects]]
  from = "/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/auth/refresh"
  to = "/.netlify/functions/auth-refresh"
  status = 200

[[redirects]]
  from = "/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/auth/oidc/start"
  to = "/.netlify/functions/auth-oidc-start"
  status = 200

[[redirects]]
  from = "/auth/oidc/callback"
  to = "/.netlify/functions/auth-oidc-callback"
  status = 200

[[redirects]]
  from = "/api/scope"
  to = "/.netlify/functions/scope"
  status = 200

[[redirects]]
  from = "/api/scope/*"
  to = "/.netlify/functions/scope"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "text/html; charset=utf-8"
